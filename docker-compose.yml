services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nodelist
      POSTGRES_USER: nodelist
      POSTGRES_PASSWORD: nodelist
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodelist -d nodelist"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://nodelist:nodelist@postgres:5432/nodelist
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - backend_uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    environment:
      INTERNAL_API_URL: http://backend:8001
      PORT: 8000
      HOSTNAME: 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  backend_uploads:
  postgres_data:
