name: Deploy

on:
  push:
    branches:
      - release/videoTovideo
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ""
          INTERNAL_API_URL: http://backend:8001
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate backend imports
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -c "import main"

      - name: Validate Docker Compose config
        run: docker compose config

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/release/videoTovideo'
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      APP_DIR: ${{ vars.APP_DIR || '/home/huangguojie/nodelist-llm' }}
      COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME || 'nodelist-llm' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Upload source and deploy
        run: |
          tar \
            --exclude='.git' \
            --exclude='backend/.env' \
            --exclude='backend/.venv' \
            --exclude='backend/__pycache__' \
            --exclude='backend/*.db' \
            --exclude='backend/data/uploads' \
            --exclude='frontend/.next' \
            --exclude='frontend/node_modules' \
            -czf - . \
          | ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "mkdir -p '$APP_DIR' && tar -xzf - -C '$APP_DIR' && APP_DIR='$APP_DIR' COMPOSE_PROJECT_NAME='$COMPOSE_PROJECT_NAME' DEPLOY_SKIP_PULL=1 bash '$APP_DIR/scripts/deploy.sh'"
